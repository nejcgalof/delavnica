<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Object Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f5f5f5;
            --text-color: #333;
            --border-color: #ddd;
            --button-bg: #007bff;
            --button-hover: #0056b3;
            --error-color: #dc3545;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #1e1e1e;
                --text-color: #e0e0e0;
                --border-color: #444;
                --button-bg: #0d6efd;
                --button-hover: #0a58ca;
                --error-color: #f8615c;
            }
        }

        :root[data-theme="dark"] {
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444;
            --button-bg: #0d6efd;
            --button-hover: #0a58ca;
            --error-color: #f8615c;
        }

        [hidden] {
            display: none !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background: var(--button-bg);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            min-height: 44px;
            min-width: 44px;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--button-hover);
        }

        button:focus {
            outline: 2px solid var(--button-bg);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="range"] {
            flex: 1;
            min-width: 100px;
            min-height: 30px;
        }

        .slider-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #file {
            display: none;
        }

        .stage {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        .stage.live {
            aspect-ratio: auto;
        }

        #placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
            background: #222;
        }

        .stage video,
        .stage img {
            display: block;
            width: 100%;
            height: auto;
        }


        #overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-area {
            background: var(--border-color);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            min-height: 60px;
        }

        #status {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            font-weight: 500;
        }

        .error {
            color: var(--error-color);
        }

        .success {
            color: #28a745;
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            input[type="range"] {
                width: 100%;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YOLO Object Detection</h1>

        <div class="controls">
            <button id="startCam">Start camera</button>
            <button id="openFile">Open image or video</button>
            <button id="stop">Stop</button>
            <div class="slider-label">
                <label for="conf">Confidence:</label>
                <input type="range" id="conf" min="0.1" max="0.99" step="0.01" value="0.35">
                <span id="confOut">0.35</span>
            </div>
        </div>

        <section class="stage" id="stage">
            <div id="placeholder">No source active</div>
            <video id="video" playsinline muted hidden></video>
            <img id="still" alt="" hidden>
            <canvas id="overlay"></canvas>
        </section>

        <div class="status-area">
            <div id="status" role="status">Ready</div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Model:</span>
                    <span id="model">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">FPS:</span>
                    <span id="fps">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Server ms:</span>
                    <span id="ms">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Detected:</span>
                    <span id="found">-</span>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="file" accept="image/*,video/*">

    <script>
        const SEND_MAX = 640;
        const JPEG_QUALITY = 0.7;

        const video = document.getElementById('video');
        const still = document.getElementById('still');
        const overlay = document.getElementById('overlay');
        const stage = document.getElementById('stage');
        const placeholder = document.getElementById('placeholder');
        const status = document.getElementById('status');

        const CONF_FLOOR = Number(document.getElementById('conf').min);
        let lastResult = null;

        const startCamBtn = document.getElementById('startCam');
        const openFileBtn = document.getElementById('openFile');
        const stopBtn = document.getElementById('stop');
        const confSlider = document.getElementById('conf');
        const confOut = document.getElementById('confOut');
        const fileInput = document.getElementById('file');

        const statusFps = document.getElementById('fps');
        const statusMs = document.getElementById('ms');
        const statusFound = document.getElementById('found');
        const statusModel = document.getElementById('model');

        let runId = null;
        let isRunning = false;
        let lastFrameAt = 0;
        let smoothedFps = 0;
        let sourceToken = 0;
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function visibleDetections() {
            const threshold = Number(confSlider.value);
            return lastResult ? lastResult.detections.filter(d => d.conf >= threshold) : [];
        }

        function renderDetections() {
            const list = visibleDetections();
            draw(list);
            const counts = {};
            for (const d of list) counts[d.label] = (counts[d.label] || 0) + 1;
            const text = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([label, n]) => (n > 1 ? `${label} ×${n}` : label))
                .join(', ');
            statusFound.textContent = text || 'nothing';
        }

        function show(data, fps) {
            lastResult = data;
            statusMs.textContent = Math.round(data.inference_ms);
            statusFps.textContent = fps ? Number(fps).toFixed(1) : '–';
            renderDetections();
        }

        confSlider.addEventListener('input', (e) => {
            confOut.textContent = Number(e.target.value).toFixed(2);
            if (lastResult) renderDetections();
        });

        function updateStatus(msg, isError = false) {
            status.textContent = msg;
            status.className = isError ? 'error' : '';
        }

        function stopAll() {
            runId = null;
            isRunning = false;
            lastResult = null;
            sourceToken++;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            video.pause();
            if (video.getAttribute('src')) {
                URL.revokeObjectURL(video.src);
                video.removeAttribute('src');
                video.load();
            }
            if (still.getAttribute('src')) {
                URL.revokeObjectURL(still.src);
                still.removeAttribute('src');
            }
            video.hidden = true;
            still.hidden = true;
            overlay.hidden = true;
            stage.classList.remove('live');
            placeholder.hidden = false;
            updateStatus('Ready');
            statusFps.textContent = '-';
            statusMs.textContent = '-';
            statusFound.textContent = '-';
        }

        function begin() {
            isRunning = true;
            runId = Math.random();
            lastFrameAt = 0;
            smoothedFps = 0;
            statusFps.textContent = '-';
            statusMs.textContent = '-';
            statusFound.textContent = '-';
            return runId;
        }

        function colorParts(label) {
            let hue = 0;
            for (const ch of label) hue = (hue * 31 + ch.charCodeAt(0)) % 360;
            return { line: `hsl(${hue} 85% 60%)`, fill: `hsl(${hue} 70% 30%)` };
        }

        function draw(detections) {
            const rect = stage.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            overlay.width = Math.round(rect.width * dpr);
            overlay.height = Math.round(rect.height * dpr);
            const ctx = overlay.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.lineWidth = 3;
            const font = getComputedStyle(document.body).fontFamily;
            ctx.font = `600 14px ${font}`;
            ctx.textBaseline = 'top';
            for (const d of detections) {
                const [x1, y1, x2, y2] = d.box;
                const x = x1 * rect.width, y = y1 * rect.height;
                const c = colorParts(d.label);
                ctx.strokeStyle = c.line;
                ctx.strokeRect(x, y, (x2 - x1) * rect.width, (y2 - y1) * rect.height);
                const text = `${d.label} ${Math.round(d.conf * 100)}%`;
                const labelY = y >= 22 ? y - 22 : y;
                ctx.fillStyle = c.fill;
                ctx.fillRect(x - 1.5, labelY, ctx.measureText(text).width + 10, 22);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(text, x + 4, labelY + 4);
            }
        }

        async function fetchInfo() {
            try {
                const resp = await fetch('/info');
                if (resp.ok) {
                    const data = await resp.json();
                    statusModel.textContent = data.model || '-';
                }
            } catch (e) {
                statusModel.textContent = 'error';
            }
        }

        function showStage() {
            placeholder.hidden = true;
            stage.classList.add('live');
            overlay.hidden = false;
        }

        function grabScaled(source, w, h) {
            const scale = Math.min(1, SEND_MAX / Math.max(w, h));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(w * scale));
            c.height = Math.max(1, Math.round(h * scale));
            c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
            return c;
        }

        async function sendFrame(canvas, id) {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', JPEG_QUALITY));
            if (!blob || id !== runId) return;
            try {
                const resp = await fetch(`/detect?conf=${CONF_FLOOR}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'image/jpeg' },
                    body: blob,
                });
                if (id !== runId) return;
                if (!resp.ok) {
                    updateStatus(`The detector answered with error ${resp.status}. Trying again...`, true);
                    await sleep(1000);
                    return;
                }
                const result = await resp.json();
                if (id !== runId) return;
                const now = performance.now();
                if (lastFrameAt) {
                    const instant = 1000 / (now - lastFrameAt);
                    smoothedFps = smoothedFps ? 0.8 * smoothedFps + 0.2 * instant : instant;
                }
                lastFrameAt = now;
                if (status.className === 'error') updateStatus('Detecting...');
                show(result, smoothedFps);
            } catch (e) {
                if (id !== runId) return;
                updateStatus(`Cannot reach the detector (${e.message}). Trying again...`, true);
                await sleep(1000);
            }
        }

        async function liveLoop(message) {
            const id = begin();
            updateStatus(message);
            while (id === runId) {
                if (video.readyState >= 2 && video.videoWidth > 0) {
                    await sendFrame(grabScaled(video, video.videoWidth, video.videoHeight), id);
                } else {
                    await sleep(100);
                }
            }
        }

        async function imageMode() {
            const id = begin();
            updateStatus('Detecting in image...');
            await sendFrame(grabScaled(still, still.naturalWidth, still.naturalHeight), id);
            if (id === runId && status.className !== 'error') updateStatus('Ready');
        }

        startCamBtn.addEventListener('click', async () => {
            stopAll();
            const token = sourceToken;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateStatus('This browser blocks the camera on this address. Open the page over HTTPS, or use http://localhost on the computer that runs the server.', true);
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                if (token !== sourceToken) {
                    stream.getTracks().forEach(t => t.stop());
                    return;
                }
                video.srcObject = stream;
                video.hidden = false;
                showStage();
                await video.play();
                liveLoop('Streaming from camera...');
            } catch (e) {
                updateStatus(`The camera is not available: ${e.message}`, true);
            }
        });

        openFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            stopAll();
            const token = sourceToken;
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video')) {
                video.loop = true;
                video.muted = true;
                video.hidden = false;
                video.addEventListener('loadeddata', async () => {
                    if (token !== sourceToken) return;
                    showStage();
                    await video.play();
                    liveLoop('Playing video...');
                }, { once: true });
                video.src = url;
            } else {
                still.hidden = false;
                still.onload = () => {
                    if (token !== sourceToken) return;
                    showStage();
                    imageMode();
                };
                still.src = url;
            }
        });

        stopBtn.addEventListener('click', stopAll);

        window.addEventListener('resize', () => { if (lastResult) renderDetections(); });

        fetchInfo();
    </script>
</body>
</html>
